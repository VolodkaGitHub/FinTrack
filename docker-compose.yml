# FinTrack — монолітний fullstack-застосунок: React SPA (nginx) + Spring Boot + єдина БД PostgreSQL.
#   docker compose up -d --build                         — застосунок: http://localhost:8088
#   docker compose --profile monitoring up -d --build    — + Prometheus (9090) і Grafana (3001)
name: fintrack

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fintrack
      POSTGRES_USER: ${DB_USER:-fintrack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fintrack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # лише для локальної розробки (backend у IDE); у мережу назовні не публікується
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # SMTP-пастка для листів підтвердження email у середовищі розробки (веб-інтерфейс: http://localhost:8026)
  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025"

  backend:
    build: ./backend
    image: fintrack-backend:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/fintrack
      DB_USER: ${DB_USER:-fintrack}
      DB_PASSWORD: ${DB_PASSWORD:-fintrack}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-FinTrack <no-reply@fintrack.local>}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8088}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:8088}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-0123456789abcdef0123456789}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Kyiv}
      JAVA_OPTS: -XX:MaxRAMPercentage=75 -Djava.awt.headless=true
    expose:
      - "8080"
      - "8081"

  frontend:
    build: ./frontend
    image: fintrack-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8088}:80"

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:12.4.14
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"

volumes:
  pgdata:
  grafana-data:
