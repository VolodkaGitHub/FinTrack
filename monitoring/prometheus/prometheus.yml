global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Spring Boot Actuator + Micrometer на окремому management-порту (не публікується назовні)
  - job_name: fintrack-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]
        labels:
          service: fintrack
